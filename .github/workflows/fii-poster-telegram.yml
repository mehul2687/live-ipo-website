name: Auto Post FII DII Poster to Telegram

on:
  schedule:
    # Mon-Fri between 06:00 PM IST (12:30 UTC) and 08:00 PM IST (14:30 UTC)
    - cron: '30,45 12 * * 1-5'
    - cron: '0,15,30,45 13 * * 1-5'
    - cron: '0,15,30 14 * * 1-5'
  workflow_dispatch:
    inputs:
      force_post:
        description: 'Force post latest FII/DII data immediately (ignores date/duplicate check)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: fii-poster-telegram
  cancel-in-progress: false

jobs:
  post-fii-poster:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Check persistent poster state (orphan poster-state branch)
        id: state_check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_POST: ${{ inputs.force_post == true || github.event.inputs.force_post == 'true' }}
        run: |
          mkdir -p /tmp/poster-state
          if git ls-remote --exit-code --heads origin poster-state >/dev/null 2>&1; then
            git clone --depth 1 --branch poster-state "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" /tmp/poster-state
          else
            git -C /tmp/poster-state init -b poster-state
            git -C /tmp/poster-state remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          fi

          IST_TODAY=$(TZ="Asia/Kolkata" date +%Y-%m-%d)
          echo "IST Today: $IST_TODAY | Force Post: $FORCE_POST"

          if [ "$FORCE_POST" != "true" ] && [ -f /tmp/poster-state/fii-poster-state.json ]; then
            LAST_POSTED=$(node -e "try{const s=JSON.parse(require('fs').readFileSync('/tmp/poster-state/fii-poster-state.json','utf8'));process.stdout.write(s.lastPostedIsoDate||'')}catch{}")
            if [ "$LAST_POSTED" = "$IST_TODAY" ]; then
              echo "Already posted today ($IST_TODAY). Exiting early."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.state_check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies (reusing preinstalled Chrome)
        if: steps.state_check.outputs.skip != 'true'
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
        run: npm install --no-save axios cheerio puppeteer-core

      - name: Generate FII/DII Poster & Post to Telegram (@liveipotrader)
        if: steps.state_check.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || '@liveipotrader' }}
          FORCE_POST: ${{ inputs.force_post == true || github.event.inputs.force_post == 'true' }}
        run: |
          node post_fii_poster_telegram.mjs \
            --state-file /tmp/poster-state/fii-poster-state.json \
            --output /tmp/poster-state/fii-poster-preview.png

      - name: Persist updated poster state (isolated poster-state branch)
        if: steps.state_check.outputs.skip != 'true'
        run: |
          cd /tmp/poster-state
          if [ -f fii-poster-state.json ]; then
            git config user.name "LiveIPO Auto-Poster"
            git config user.email "actions@users.noreply.github.com"
            git add fii-poster-state.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update FII/DII poster state [skip ci]"
              git push -u origin poster-state
            fi
          fi
