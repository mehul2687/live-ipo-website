name: Auto Sync IPO Subscription

on:
  schedule:
    # Runs automatically every 30 minutes to update IPOs and daily market indices
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      target_ipo_id:
        description: 'Optional single IPO ID for fast instant sync'
        required: false
        default: ''
        type: string
      sync_mode:
        description: 'Sync scope: ipos (fast) or all'
        required: false
        default: 'all'
        type: string

permissions:
  contents: write

concurrency:
  group: sync-cron
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund axios cheerio

      - name: Run sync script
        env:
          TARGET_IPO_ID: ${{ github.event.inputs.target_ipo_id || '' }}
          SYNC_MODE: ${{ github.event.inputs.sync_mode || 'all' }}
        run: |
          if [ -n "$TARGET_IPO_ID" ]; then
            node sync-cron.js --once --ipo="$TARGET_IPO_ID"
          elif [ "$SYNC_MODE" = "ipos" ]; then
            node sync-cron.js --once --ipos-only
          else
            node sync-cron.js --once
          fi

      - name: Commit and push updated market and IPO data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add indices-data.json indices-history-data.json index-stocks-data.json fii-dii-data.json fii-dii-fno-data.json ipo-data.json
          if git diff --staged --quiet; then
            echo "✓ No data changes to commit. Everything up to date."
          else
            git commit -m "Auto sync daily market data [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push origin main
          fi
