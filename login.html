<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live IPO - Admin Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #0d1b2a;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .login-card h2 {
            margin-bottom: 20px;
            color: #0f172a;
            font-size: 22px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
        }

        .btn-login {
            width: 100%;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 11px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: #1d4ed8;
        }

        .error-msg {
            color: #dc2626;
            font-size: 12.5px;
            text-align: center;
            margin-top: 10px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h2>📊 Admin Central Login</h2>
        <form id="loginForm" onsubmit="handleAdminLogin(event)">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="adminUser" required placeholder="Enter username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPass" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn-login">Login to Dashboard</button>
            <div id="errorMsg" class="error-msg"></div>
        </form>
    </div>

    <script>
        function handleAdminLogin(e) {
            e.preventDefault();
            const user = document.getElementById('adminUser').value.trim();
            const pass = document.getElementById('adminPass').value.trim();

            // અહીં તમે તમારો મનપસંદ યુઝરનેમ અને પાસવર્ડ રાખી શકો છો
            const correctUser = "admin";
            const correctPass = "liveipo2026";

            if (user === correctUser && pass === correctPass) {
                // લોગિન સફળ થાય એટલે લોકલસ્ટોરેજમાં ટોકન સેવ કરો અને એડમિન પર મોકલો
                localStorage.setItem('live_ipo_admin_logged', 'true');
                window.location.href = 'admin.html';
            } else {
                document.getElementById('errorMsg').innerText = "❌ ખોટું યુઝરનેમ અથવા પાસવર્ડ!";
            }
        }
    </script>
</body>

</html>
